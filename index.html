<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>لیست کار ها</h1>
        <p class="touch-hint">
    👆 برای ویرایش یا حذف، روی تسک چند لحظه نگه دارید
        </p>
        <div class="input-box">
            <input class="text" id="taskInput" placeholder="کار جدید را وارد کنید ...">
            <button id="addBtn">افزودن</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
